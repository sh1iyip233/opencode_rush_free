name: relaydesk

services:
  volume-init:
    image: alpine:3.21
    command: ["chown", "-R", "10001:10001", "/data"]
    volumes:
      - opencode_data:/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: "no"

  opencode-proxy:
    build: .
    depends_on:
      volume-init:
        condition: service_completed_successfully
    ports:
      # Publish the port the app actually listens on: the container reads PORT
      # from .env as well, so a custom PORT must appear on both sides. Pinning
      # the container side to 8080 publishes a port nothing listens on.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:${PORT:-8080}"
      # Optional dedicated log listener. Set LOG_API_ADDR (and
      # LOG_API_PORT to publish it) only when the log API should live on its
      # own port; the same endpoints are always reachable on PORT above.
      # - "${LOG_API_BIND:-127.0.0.1}:${LOG_API_PORT:-8099}:${LOG_API_PORT:-8099}"
    env_file:
      - .env
    environment:
      WEB_DIR: /app/web/dist
      DATABASE_PATH: /data/app.db
      PORT: "${PORT:-8080}"
      LOG_API_ADDR: "${LOG_API_ADDR:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - opencode_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-8080}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  opencode_data:
